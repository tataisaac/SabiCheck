name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Lets the Flutter job publish analyzer/test/build output as a Check Run,
  # readable through the REST API (raw job logs live on blob storage that the
  # agent sandbox cannot reach).
  checks: write

jobs:
  backend:
    name: Backend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke-test the built server (mock mode)
        run: |
          SABICHECK_MODE=mock PORT=8099 node dist/server.js &
          PID=$!
          for i in $(seq 1 20); do curl -fs http://localhost:8099/healthz && break; sleep 0.5; done
          curl -fs -X POST http://localhost:8099/v1/analyze \
            -H 'Content-Type: application/json' \
            -d '{"message":"Send your PIN and 2000 FCFA to claim your prize","language":"fr"}' | tee /tmp/out.json
          grep -q '"riskLevel":"High"' /tmp/out.json
          kill $PID

  flutter:
    name: Flutter (analyze · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Check formatting (advisory — run `dart format lib test` locally to fix)
        run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true
      - name: flutter analyze
        id: analyze
        run: |
          set +e
          mkdir -p ci-logs
          flutter analyze --fatal-infos 2>&1 | tee ci-logs/analyze.txt
          status=${PIPESTATUS[0]}
          {
            echo "## flutter analyze (exit $status)"
            echo '```'
            tail -n 120 ci-logs/analyze.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: flutter test
        id: test
        run: |
          set +e
          flutter test --reporter compact 2>&1 | tee ci-logs/test.txt
          status=${PIPESTATUS[0]}
          {
            echo "## flutter test (exit $status)"
            echo '```'
            grep -vE '^\s*$' ci-logs/test.txt | grep -E "^[0-9]{2}:[0-9]{2} \+[0-9]+.*(-[0-9]+|: (Some tests failed|All tests passed))|Expected|Actual|Which|package:|test/|Error|error|EXCEPTION|═|The following" | tail -n 150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Build debug APK (compiles Android + all plugins)
        id: apk
        run: |
          set +e
          flutter build apk --debug --dart-define=SABICHECK_API_URL=https://api.sabicheck.example 2>&1 | tee ci-logs/apk.txt
          status=${PIPESTATUS[0]}
          { echo "## flutter build apk (exit $status)"; echo '```'; grep -vE '^\s*$' ci-logs/apk.txt | tail -n 60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Build web
        id: web
        run: |
          set +e
          flutter build web --release --dart-define=SABICHECK_API_URL=https://api.sabicheck.example 2>&1 | tee ci-logs/web.txt
          status=${PIPESTATUS[0]}
          { echo "## flutter build web (exit $status)"; echo '```'; grep -vE '^\s*$' ci-logs/web.txt | tail -n 40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Publish results as a Check Run (always)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STEP_ANALYZE: ${{ steps.analyze.outcome }}
          STEP_TEST: ${{ steps.test.outcome }}
          STEP_APK: ${{ steps.apk.outcome }}
          STEP_WEB: ${{ steps.web.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, pathlib
          parts = []
          conclusion = "success"
          for name in ["analyze", "test", "apk", "web"]:
              f = pathlib.Path(f"ci-logs/{name}.txt")
              if not f.exists():
                  parts.append(f"## {name}\n_(skipped)_\n"); continue
              lines = [l.rstrip()[:400] for l in f.read_text(errors="replace").splitlines() if l.strip()]
              parts.append(f"## {name}\n```\n" + "\n".join(lines[-220:]) + "\n```\n")
          text = "\n".join(parts)
          text = text[-60000:]
          for name in ["analyze", "test", "apk", "web"]:
              if os.environ.get(f"STEP_{name.upper()}") == "failure":
                  conclusion = "failure"
          body = {
              "name": "Flutter CI report",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": conclusion,
              "output": {"title": f"Flutter CI report ({conclusion})", "summary": "Output of flutter analyze / test / build. Fetch with: gh api repos/OWNER/REPO/commits/SHA/check-runs", "text": text},
          }
          pathlib.Path("/tmp/check.json").write_text(json.dumps(body))
          subprocess.run(["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/check-runs", "--input", "/tmp/check.json", "--silent"], check=False)
          PY
        # step outcomes so the report can carry an accurate conclusion
        # (steps use `set +e` internally but still exit non-zero on failure)
      - name: Upload CI logs (always)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flutter-ci-logs
          path: ci-logs/
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        with:
          name: sabicheck-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
