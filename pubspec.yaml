name: sabicheck
description: "SabiCheck — AI-powered scam & fraud verifier for African digital users (Cameroon / West Africa). Know what's real."
publish_to: 'none'

# Version + build number (Android versionName+versionCode, iOS CFBundleShortVersionString+CFBundleVersion).
version: 0.1.0+1

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP client for the SabiCheck API (backend proxy — never Gemini directly).
  http: ^1.6.0
  # Simple app state (ChangeNotifier + InheritedWidget).
  provider: ^6.1.5
  # Settings + local history.
  shared_preferences: ^2.5.5
  # Screenshot picker (gallery / camera).
  image_picker: ^1.2.3
  # Cross-platform file handle (used to read images shared into the app).
  cross_file: ^0.3.5
  # The killer feature: receive text/images from the Android/iOS share sheet.
  receive_sharing_intent: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
